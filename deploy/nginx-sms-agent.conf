# Public exposure for the APK agent behind an HTTPS reverse proxy.
# Phones poll this from anywhere with the device bearer token; only
# /agent/* is exposed — the operator API stays loopback-only.
#
# Inside the TLS server block of your domain (e.g. msg.example.com):
#
#   location ^~ /sms-gateway/agent/ {
#       proxy_pass http://127.0.0.1:8788/agent/;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_read_timeout 60s;
#   }
#
# Then configure the app with server URL https://<domain>/sms-gateway and
# keep the gateway itself bound to HOST=127.0.0.1.
